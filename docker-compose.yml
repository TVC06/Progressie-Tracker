name: progressie-tracker

services:
  progresset:
    build: .
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATA_DIR=/app/data
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    volumes:
      - ./data:/app/data
